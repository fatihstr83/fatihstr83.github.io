<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kafa Arena 1v1</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0b1626; color: #fff;
               font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif; user-select: none; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  /* ---- Skor tabelası ---- */
  #hud { position: fixed; top: 0; left: 50%; transform: translateX(-50%); display: flex; align-items: stretch;
         border-radius: 0 0 18px 18px; overflow: hidden; background: #12181d; box-shadow: 0 6px 18px rgba(0,0,0,.45); z-index: 5; }
  .side { display: flex; align-items: center; gap: 12px; padding: 8px 22px; min-width: 220px; font-weight: 700; font-size: 17px; border-bottom: 5px solid; }
  .side.blue { border-color: #1976d2; } .side.red { border-color: #d32f2f; justify-content: flex-end; }
  .score { font-size: 36px; font-weight: 800; min-width: 28px; text-align: center; }
  #timer { padding: 8px 22px; min-width: 124px; text-align: center; font-size: 32px; font-weight: 800; background: #0b0f12; font-variant-numeric: tabular-nums; }
  /* ---- Alt ipucu çubuğu ---- */
  #hint { position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%); display: flex; gap: 20px; padding: 8px 20px;
          background: rgba(10,14,18,.72); border-radius: 999px; font-size: 14px; z-index: 5; white-space: nowrap; }
  #hint span { display: flex; align-items: center; gap: 6px; }
  kbd { display: inline-block; min-width: 26px; padding: 3px 8px; text-align: center; font: 700 13px "Segoe UI", Roboto, Arial, sans-serif;
        color: #12181d; background: #f5f5f5; border-radius: 6px; border-bottom: 3px solid #90a4ae; }
  /* ---- Ekran kaplaması ---- */
  #overlay { position: fixed; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center;
             background: rgba(8,12,16,.8); backdrop-filter: blur(6px); }
  #overlay.hidden { display: none; }
  .card { width: min(640px, 92vw); padding: 34px; text-align: center; background: #151c22; border: 1px solid #2b3842; border-radius: 18px;
          box-shadow: 0 20px 60px rgba(0,0,0,.55); }
  .card h2 { font-size: 42px; font-weight: 800; margin-bottom: 14px; }
  #ovBody { font-size: 17px; line-height: 1.55; color: #e0e6ea; }
  .keys { display: grid; gap: 12px; margin: 8px auto 16px; width: fit-content; text-align: left; }
  .keys div { display: flex; align-items: center; gap: 8px; }
  .keys kbd { font-size: 15px; padding: 5px 10px; }
  #ovBtn { margin-top: 18px; padding: 13px 38px; font: 700 18px "Segoe UI", Roboto, Arial, sans-serif; color: #fff; background: #1976d2;
           border: 2px solid #fff; border-radius: 8px; cursor: pointer; }
  #ovBtn:hover { background: #1565c0; } #ovBtn:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
  small.lv { font-size: 12px; font-weight: 700; padding: 2px 8px; margin-left: 8px; border-radius: 999px; background: rgba(255,255,255,.14); }
  .sub { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
  .lvnum { font-size: 68px; font-weight: 800; line-height: 1; }
  .lvname { font-size: 24px; font-weight: 700; margin: 8px 0 14px; color: #ffcc80; }
  .segs { display: flex; gap: 6px; justify-content: center; margin: 10px 0 16px; }
  .seg { width: 32px; height: 42px; border: 0; border-radius: 6px; cursor: pointer; background: #2b3842; color: #cfd8dc;
         font-weight: 700; font-size: 13px; font-family: inherit; }
  .seg:hover { background: #3b4c58; }
  #ovBtn2 { margin: 18px 0 0 10px; padding: 13px 30px; font: 700 18px "Segoe UI", Roboto, Arial, sans-serif; color: #fff; background: #37474f;
            border: 2px solid #90a4ae; border-radius: 8px; cursor: pointer; }
  #ovBtn2:hover { background: #455a64; } #ovBtn2:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
  #overlay.menu-mode { justify-content: flex-end; padding-right: 5vw; backdrop-filter: none;
    background: linear-gradient(90deg, rgba(8,12,16,0) 0%, rgba(8,12,16,.5) 38%, rgba(8,12,16,.94) 100%); }
  .menu-mode .card { width: min(520px, 92vw); max-height: 92vh; overflow: auto; background: rgba(16,22,28,.9); }
  .menu-mode h2 { font-size: 50px; letter-spacing: 1px; background: linear-gradient(90deg, #64b5f6, #ffffff, #ef7a7a);
    -webkit-background-clip: text; background-clip: text; color: transparent; }
  .chips { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-bottom: 14px; }
  .chip2 { background: #1f2a33; border: 1px solid #33444f; border-radius: 999px; padding: 6px 14px; font-size: 14px; color: #cfd8dc; }
  .chip2 b { color: #ffd54f; margin-left: 4px; }
  .mbtn { display: block; width: 100%; margin: 8px 0; padding: 14px 18px; font-weight: 700; font-size: 18px; font-family: inherit; color: #fff;
          text-align: left; cursor: pointer; background: linear-gradient(180deg, #2a3946, #1d2933); border: 1px solid #3d5160; border-radius: 10px;
          transition: transform .08s, background .15s; }
  .mbtn:hover, .mbtn:focus-visible { background: linear-gradient(180deg, #1976d2, #1259a4); transform: translateX(4px); outline: none; border-color: #90caf9; }
  .mbtn.primary { background: linear-gradient(180deg, #43a047, #2e7d32); border-color: #a5d6a7; font-size: 22px; text-align: center; }
  .mbtn.primary:hover, .mbtn.primary:focus-visible { background: linear-gradient(180deg, #57b85b, #388e3c); transform: scale(1.02); }
  .mbtn small { display: block; font-weight: 500; font-size: 13px; color: #b0bec5; margin-top: 3px; }
  .mbtn:disabled { opacity: .45; cursor: default; transform: none; }
  .mbtn.sm { width: auto; margin: 0; padding: 10px 16px; font-size: 15px; white-space: nowrap; }
  .mbtn.sel { border-color: #ffd54f; box-shadow: 0 0 0 2px rgba(255,213,79,.35); }
  .mbtn.lock { color: #ef9a9a; } .mbtn.lock small { color: #ef9a9a; }
  .mbtn.card { text-align: left; } .tag { float: right; font-size: 12px; color: #ffd54f; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid #26333d; text-align: left; }
  .rl small { display: block; color: #90a4ae; font-size: 12px; margin: 2px 0 6px; }
  .pips { display: flex; gap: 3px; } .pips i { width: 18px; height: 8px; border-radius: 3px; background: #2b3842; }
  .pips i.on { background: linear-gradient(90deg, #66bb6a, #ffd54f); }
  .tabs { display: flex; gap: 8px; margin-bottom: 12px; } .tabs .mbtn { flex: 1; text-align: center; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; } .grid .mbtn { margin: 0; text-align: center; font-size: 15px; }
  .foot { margin-top: 12px; font-size: 13px; color: #90a4ae; } .hintline { margin-top: 12px; font-size: 14px; color: #ffcc80; }
  .reward { margin: 14px auto 0; padding: 12px 18px; background: #1f2a33; border-radius: 12px; border: 1px solid #ffd54f; width: fit-content; }
  .reward b { color: #ffd54f; font-size: 24px; } .reward small { display: block; color: #90a4ae; margin-top: 4px; }
  #toast { position: fixed; top: 92px; left: 50%; transform: translate(-50%, -20px); background: #ffd54f; color: #12181d; font-weight: 800;
           padding: 10px 24px; border-radius: 999px; opacity: 0; pointer-events: none; transition: .3s; z-index: 20; }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
  <div class="side blue"><span>SEN</span><span class="score" id="s1">0</span></div>
  <div id="timer">1:30</div>
  <div class="side red"><span class="score" id="s2">0</span><span>BİLGİSAYAR<small class="lv" id="lvTag">Sv. 6</small></span></div>
</div>
<div id="hint">
  <span><kbd>A</kbd><kbd>D</kbd> Hareket</span><span><kbd>W</kbd> Zıpla</span><span><kbd>Boşluk</kbd> Şut</span>
  <span><kbd>H</kbd> Yardım</span><span><kbd>K</kbd> Zorluk</span><span><kbd>F</kbd> Tam ekran</span><span><kbd>M</kbd> <b id="muteTxt">Ses açık</b></span><span><kbd>N</kbd> Müzik</span>
</div>
<div id="overlay"><div class="card"><h2 id="ovTitle"></h2><div id="ovBody"></div><button id="ovBtn"></button><button id="ovBtn2"></button></div></div>
<div id="toast"></div>

<script>
(() => {
  'use strict';
  /* ================= Sabitler ================= */
  const W = 900, H = 500, G = 430;                 // dünya boyutu ve zemin çizgisi
  const GW = 62, GT = 268, CB = 10, CEIL = 44;     // kale genişliği, üst direk, direk kalınlığı, tavan
  const HR = 32, SR = 14, BR = 16;                 // kafa, ayakkabı, top yarıçapı
  const REST_Y = G - 64;                           // yerdeki kafa merkezi
  const GRAV = 2000, JUMP = 780, BALL_G = 1400;
  const P_SPEED = 300, AI_SPEED = 245, KICK_DUR = 0.26, KICK_CD = 0.45, MATCH_TIME = 90;
  const TEAM = {
    p1: { c: '#1976d2', l: '#64b5f6', d: '#0d47a1' },
    p2: { c: '#d32f2f', l: '#ef7a7a', d: '#8e1b1b' }
  };
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  /* ================= Kayıt, güçlendirme, aksesuar, zorluk modları ================= */
  const UPS = [
    { id: 'spd',  name: 'Koşu Hızı',   desc: 'Daha hızlı koşarsın',               per: '+4% hız' },
    { id: 'jmp',  name: 'Zıplama',     desc: 'Daha yükseğe zıplarsın',            per: '+3% yükseklik' },
    { id: 'kick', name: 'Şut Gücü',    desc: 'Şutların daha sert çıkar',          per: '+4% güç' },
    { id: 'head', name: 'Kafa Vuruşu', desc: 'Kafa vuruşunda top daha çok sekmeli', per: '+3% sekme' },
    { id: 'pow',  name: 'Güç Süresi',  desc: 'Güç topları daha uzun sürer',       per: '+8% süre' }
  ];
  const UP_MAX = 10, upCost = lv => 40 + 35 * lv;
  const ACC = {
    hat: [
      { id: 'none', name: 'Yok', price: 0, need: 0 }, { id: 'cap', name: 'Kasket', price: 60, need: 0 }, { id: 'band', name: 'Bandana', price: 90, need: 0 },
      { id: 'top', name: 'Silindir', price: 120, need: 0 }, { id: 'cow', name: 'Kovboy Şapkası', price: 150, need: 6 },
      { id: 'vik', name: 'Viking Miğferi', price: 220, need: 12 }, { id: 'crown', name: 'Altın Taç', price: 400, need: 24 }
    ],
    face: [
      { id: 'none', name: 'Yok', price: 0, need: 0 }, { id: 'glass', name: 'Gözlük', price: 70, need: 0 },
      { id: 'stache', name: 'Bıyık', price: 90, need: 0 }, { id: 'shade', name: 'Güneş Gözlüğü', price: 110, need: 4 }
    ],
    shoe: [
      { id: 'black', name: 'Siyah', price: 0, need: 0, col: '#1b1b1b' }, { id: 'pink', name: 'Pembe', price: 80, need: 0, col: '#f06292' },
      { id: 'silver', name: 'Gümüş', price: 100, need: 0, col: '#cfd8dc' }, { id: 'gold', name: 'Altın', price: 200, need: 8, col: '#fbc02d' }
    ]
  };
  const SLOT_NAME = { hat: 'Şapka', face: 'Yüz', shoe: 'Ayakkabı' };
  const MODES = [
    { id: 0, name: 'Normal', need: 0, desc: 'Klasik maç.', coin: 1, time: 90, g: 1, j: 1, acc: 14, fr: 0.9, orb: 1, kp: 1, as: 1, at: 1, an: 1, ak: 1, minLv: 1,
      theme: { skyTop: '#0b1626', skyBot: '#2a4058', grass: '#2e7d32', stripe: 'rgba(255,255,255,.055)' } },
    { id: 1, name: 'Sert Rakip', need: 8, desc: 'Bot daha hızlı, daha çabuk tepki verir ve daha sert vurur.', coin: 1.3, time: 90, g: 1, j: 1, acc: 14, fr: 0.9, orb: 1, kp: 1, as: 1.15, at: 0.8, an: 0.8, ak: 1.1, minLv: 5,
      theme: { skyTop: '#1a0f12', skyBot: '#5a3038', grass: '#2e7d32', stripe: 'rgba(255,255,255,.055)' } },
    { id: 2, name: 'Buz Pisti', need: 16, desc: 'Zemin kaygan, herkes kayar. Top uzun süre yuvarlanır.', coin: 1.5, time: 90, g: 1, j: 1, acc: 3.2, fr: 0.12, orb: 1, kp: 1, as: 1.05, at: 1, an: 1, ak: 1, minLv: 6,
      theme: { skyTop: '#0d2538', skyBot: '#5f8fb0', grass: '#9cc3d6', stripe: 'rgba(255,255,255,.2)' } },
    { id: 3, name: 'Ay Yerçekimi', need: 24, desc: 'Yerçekimi yarıya iner: dev zıplamalar, uçan toplar.', coin: 1.7, time: 90, g: 0.5, j: 0.85, acc: 14, fr: 0.9, orb: 0.7, kp: 1, as: 1.05, at: 1, an: 1, ak: 1, minLv: 7,
      theme: { skyTop: '#05050f', skyBot: '#1b1b4a', grass: '#5c6b73', stripe: 'rgba(255,255,255,.07)', stars: true } },
    { id: 4, name: 'Kaos', need: 32, desc: '60 saniye. Güç topları sürekli yağar, şutlar çok sert.', coin: 2, time: 60, g: 1, j: 1, acc: 14, fr: 0.9, orb: 0.3, kp: 1.25, as: 1.1, at: 0.8, an: 0.8, ak: 1.1, minLv: 8,
      theme: { skyTop: '#2a0a0a', skyBot: '#8a3016', grass: '#2e7d32', stripe: 'rgba(255,255,255,.055)' } },
    { id: 5, name: 'Efsane Boss', need: 42, desc: '60 saniye. Bot çok güçlü, kazanmak ustalık ister.', coin: 3, time: 60, g: 1, j: 1, acc: 14, fr: 0.9, orb: 1, kp: 1.1, as: 1.3, at: 0.6, an: 0.5, ak: 1.2, minLv: 12,
      theme: { skyTop: '#0a0a0a', skyBot: '#4a3a10', grass: '#1f5d27', stripe: 'rgba(255,215,64,.06)' } }
  ];
  const defSave = () => ({ coins: 150, up: { spd: 0, jmp: 0, kick: 0, head: 0, pow: 0 }, own: { hat: ['none'], face: ['none'], shoe: ['black'] },
                           eq: { hat: 'none', face: 'none', shoe: 'black' }, mode: 0, matches: 0, wins: 0, goals: 0 });
  let SAVE = defSave();
  try {
    const raw = JSON.parse(localStorage.getItem('kafaArenaSave'));
    if (raw && raw.up) { const d = defSave(); SAVE = Object.assign(d, raw); SAVE.up = Object.assign(defSave().up, raw.up); SAVE.own = Object.assign(defSave().own, raw.own); SAVE.eq = Object.assign(defSave().eq, raw.eq); }
  } catch (e) {}
  const save = () => { try { localStorage.setItem('kafaArenaSave', JSON.stringify(SAVE)); } catch (e) {} };
  const power = () => Object.values(SAVE.up).reduce((a, b) => a + b, 0);
  if (!MODES[SAVE.mode] || MODES[SAVE.mode].need > power()) SAVE.mode = 0;
  let ST = {}, MODE = MODES[SAVE.mode];
  function applyStats() { const u = SAVE.up; ST = { spd: 1 + 0.04 * u.spd, jmp: 1 + 0.03 * u.jmp, kick: 1 + 0.04 * u.kick, head: 0.85 + 0.03 * u.head, pow: 1 + 0.08 * u.pow }; }
  function applyMode() { MODE = MODES[SAVE.mode] || MODES[0]; applyLevel(); buildBg(); }
  function aiAcc() {                                    // botun aksesuarı seviyeye göre değişir
    const lv = Math.max(level, MODE.minLv);
    return { hat: lv >= 14 ? 'crown' : lv >= 11 ? 'vik' : lv >= 8 ? 'cow' : lv >= 5 ? 'band' : lv >= 3 ? 'cap' : 'none', face: lv >= 10 ? 'shade' : 'none', shoe: lv >= 13 ? 'gold' : 'black' };
  }

  /* ================= Zorluk seviyeleri (15 adet) ================= */
  const LEVELS = ['Acemi', 'Çaylak', 'Amatör', 'Mahalle Maçı', 'Düzenli Oyuncu', 'Orta', 'Lig Oyuncusu', 'Yetenekli',
                  'Usta', 'Profesyonel', 'Kaptan', 'Yıldız', 'Dünya Klasmanı', 'Efsane', 'İmkânsız'];
  let level = 6;
  try { const sv = parseInt(localStorage.getItem('kafaArenaLevel'), 10); if (sv >= 1 && sv <= 15) level = sv; } catch (e) {}
  let AI = {};
  function applyLevel() {
    const t = (Math.max(level, MODE.minLv) - 1) / 14;                       // 0 (en kolay) .. 1 (en zor)
    AI = {
      speed: 150 + 160 * t,                           // koşu hızı
      think: 0.32 - 0.28 * t,                         // karar verme aralığı (tepki gecikmesi)
      noise: 90 - 84 * t,                             // top konumunu yanlış algılama payı
      lead: 0.04 + 0.4 * t,                           // topun gideceği yeri tahmin gücü
      kickPow: 520 + 300 * t,                         // şut gücü
      wait: (1 - t) * 0.4,                            // şuta geç başlama süresi
      jumpRange: 50 + 60 * t,                         // kafa vuruşu için zıplama menzili
      jumpOk: 0.25 + 0.75 * t                         // zıplamayı doğru zamanda yapma olasılığı
    };
    AI.speed *= MODE.as; AI.think *= MODE.at; AI.noise *= MODE.an; AI.kickPow *= MODE.ak;
    document.getElementById('lvTag').textContent = 'Sv. ' + Math.max(level, MODE.minLv);
    try { localStorage.setItem('kafaArenaLevel', level); } catch (e) {}
  }
  applyLevel();

  /* ================= DOM ================= */
  const cv = document.getElementById('game'), ctx = cv.getContext('2d');
  const elS1 = document.getElementById('s1'), elS2 = document.getElementById('s2'), elT = document.getElementById('timer');
  const ov = document.getElementById('overlay'), ovTitle = document.getElementById('ovTitle');
  const ovBody = document.getElementById('ovBody'), ovBtn = document.getElementById('ovBtn');
  const muteTxt = document.getElementById('muteTxt');
  const ovBtn2 = document.getElementById('ovBtn2'), toastEl = document.getElementById('toast');

  /* ================= SES MOTORU (Web Audio, dosyasız) ================= */
  const Snd = (() => {
    let ac = null, master, buf, crowdG, crowdF, muted = false;
    const last = {};
    const ok = (k, ms = 60) => { const n = performance.now(); if (last[k] && n - last[k] < ms) return false; last[k] = n; return true; };
    const on = () => ac && !muted;

    function init() {
      if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
      try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
      const comp = ac.createDynamicsCompressor();
      master = ac.createGain(); master.gain.value = muted ? 0 : 0.9;
      master.connect(comp); comp.connect(ac.destination);
      // Stadyum yankısı: üretilen darbe cevabıyla kısa bir reverb
      const conv = ac.createConvolver(), irLen = Math.floor(ac.sampleRate * 1.8), ir = ac.createBuffer(1, irLen, ac.sampleRate), id = ir.getChannelData(0);
      for (let i = 0; i < irLen; i++) id[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / irLen, 2.6);
      conv.buffer = ir; const revG = ac.createGain(); revG.gain.value = 0.2; master.connect(revG); revG.connect(conv); conv.connect(comp);
      musicBus = ac.createGain(); musicBus.gain.value = muted || !musicOn ? 0 : 0.28; musicBus.connect(comp);
      buf = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      // Seyirci uğultusu: sürekli çalan filtrelenmiş gürültü
      const s = ac.createBufferSource(); s.buffer = buf; s.loop = true;
      const f1 = ac.createBiquadFilter(); f1.type = 'bandpass'; f1.frequency.value = 650; f1.Q.value = 0.5;
      crowdF = f1; crowdG = ac.createGain(); crowdG.gain.value = 0.05;
      const lfo = ac.createOscillator(), lg = ac.createGain(); lfo.frequency.value = 0.35; lg.gain.value = 0.012;
      lfo.connect(lg); lg.connect(crowdG.gain); lfo.start();
      s.connect(f1); f1.connect(crowdG); crowdG.connect(master); s.start(); if (want) music(want);
    }
    // Filtrelenmiş gürültü patlaması
    function noise(o) {
      const t = ac.currentTime + (o.d || 0), dur = o.dur, a = o.att || 0.002;
      const s = ac.createBufferSource(); s.buffer = buf;
      const f = ac.createBiquadFilter(); f.type = o.type; f.frequency.setValueAtTime(o.f, t); f.Q.value = o.q || 0.7;
      if (o.f2) f.frequency.exponentialRampToValueAtTime(o.f2, t + dur);
      const g = ac.createGain(); g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(o.g, t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      s.connect(f); f.connect(g); g.connect(master); s.start(t, Math.random(), dur + 0.05);
    }
    // Frekansı süpüren ton
    function tone(o) {
      const t = ac.currentTime + (o.d || 0), dur = o.dur;
      const os = ac.createOscillator(); os.type = o.type || 'sine';
      os.frequency.setValueAtTime(o.f, t);
      if (o.f2) os.frequency.exponentialRampToValueAtTime(o.f2, t + dur);
      const g = ac.createGain(); g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(o.g, t + (o.att || 0.003)); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      os.connect(g); g.connect(master); os.start(t); os.stop(t + dur + 0.05);
    }
    // Seyirci tezahüratı dalgası
    function roar(level, bright, dur = 3) {
      if (!ac) return;
      const t = ac.currentTime, g = crowdG.gain, f = crowdF.frequency;
      g.cancelScheduledValues(t); g.setValueAtTime(Math.max(0.05, g.value), t);
      g.linearRampToValueAtTime(0.05 + level, t + 0.3); g.exponentialRampToValueAtTime(0.05, t + dur);
      f.cancelScheduledValues(t); f.setValueAtTime(f.value, t);
      f.linearRampToValueAtTime(bright ? 1500 : 450, t + 0.4); f.exponentialRampToValueAtTime(650, t + dur);

  function buyUpgrade(id) {

  function showAcc() {

  function accAction(arg) {

    if (!SAVE.own[slot].includes(id)) {

  function showModes() {

        (lock ? 'Kilitli: Güç ' + m.need : sel ? 'Seçili' : 'Açık') + '</span><small>' + m.desc + ' Altın x' + m.coin + ', ' + m.time + ' sn.</small></button>';

  function pickMode(i) {

  }

  /* ================= Zorluk menüsü (K tuşu) ================= */
  let diffOpen = false, diffReturn = null;
  function diffHtml() {

      const on = i <= level, col = 'hsl(' + Math.round(120 - 120 * (i - 1) / 14) + ' 70% 40%)';

  }

  }
  function setLevel(n) { level = clamp(n, 1, 15); applyLevel(); renderDiff(); }
  function openDiff() {
    if (diffOpen || state === 'goal' || state === 'replay' || state === 'count') return;
    const prev = state;
    diffOpen = true; if (prev === 'play') state = 'paused';
    diffReturn = () => {
      diffOpen = false;

    };
    showOverlay('Bot Zorluğu', '', 'Kaydet ve Devam Et', closeDiff); renderDiff();
  }
  function closeDiff() { if (diffReturn) { const f = diffReturn; diffReturn = null; f(); } }

  /* ================= Girdi ================= */
  addEventListener('keydown', e => {
    if (['Space', 'KeyW', 'KeyA', 'KeyS', 'KeyD'].includes(e.code) && !(e.code === 'Space' && document.activeElement && document.activeElement.tagName === 'BUTTON')) e.preventDefault();
    if ((e.code === 'ArrowDown' || e.code === 'ArrowUp') && !ov.classList.contains('hidden')) {     // menüde yön tuşlarıyla gez
      e.preventDefault();
      const bs = Array.from(ov.querySelectorAll('button')).filter(b => !b.disabled && b.style.display !== 'none');
      if (bs.length) { const i = bs.indexOf(document.activeElement); bs[(i + (e.code === 'ArrowDown' ? 1 : bs.length - 1)) % bs.length].focus(); }
    }
    if (e.code === 'Backspace' && state === 'menu' && scr !== 'main' && !diffOpen) showMain();
    if (!e.repeat) {
      if (diffOpen) {
        if (e.code === 'ArrowLeft' || e.code === 'KeyA') setLevel(level - 1);
        if (e.code === 'ArrowRight' || e.code === 'KeyD') setLevel(level + 1);
      }
      if (e.code === 'KeyK') { if (diffOpen) closeDiff(); else openDiff(); }
      if (e.code === 'KeyH' && !diffOpen) { if (state === 'play') { state = 'paused'; showHelp(false); } else if (state === 'paused') resume(); }
      if (state === 'replay' && (e.code === 'Space' || e.code === 'Enter')) endReplay();
      if (e.code === 'KeyF') toggleFull();
      if (e.code === 'KeyM') Snd.toggle();
      if (e.code === 'KeyN') Snd.musicToggle();
    }
    keys[e.code] = true;
  });
  addEventListener('keyup', e => { keys[e.code] = false; });
  addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
  ovBtn.addEventListener('click', () => { userGesture(); Snd.ui('click'); overlayAction && overlayAction(); });
  ovBtn2.addEventListener('click', () => { userGesture(); Snd.ui('click'); overlayAction2 && overlayAction2(); });
  ovBody.addEventListener('click', e => {
    const b = e.target && e.target.closest && e.target.closest('[data-act]');
    if (b) { userGesture(); act(b.dataset.act, b.dataset.arg); }
  });
  ov.addEventListener('mouseover', e => { if (e.target && e.target.closest && e.target.closest('button')) Snd.ui('hover'); });
  addEventListener('resize', resize);

  /* ================= Parçacıklar ================= */
  function dust(x, y, n, spd) {
    for (let i = 0; i < n; i++) particles.push({ t: 'd', x: x + (Math.random() - 0.5) * 16, y: y - 2, vx: (Math.random() - 0.5) * spd, vy: -Math.random() * spd * 0.5, life: 0.5, max: 0.5, r: 2 + Math.random() * 3 });
  }
  function confetti(n) {
    const cs = ['#1976d2', '#d32f2f', '#ffffff', '#fdd835'];
    for (let i = 0; i < n; i++) particles.push({ t: 'c', x: Math.random() * W, y: -20 - Math.random() * 120, vx: (Math.random() - 0.5) * 120, vy: 80 + Math.random() * 120, life: 3, max: 3, r: 4 + Math.random() * 3, a: Math.random() * 6, c: cs[i % 4] });
  }

  /* ================= Fizik ================= */
  function movePlayer(p, dt, speed) {
    const wasAir = !p.on;
    p.vx += (p.ix * speed - p.vx) * Math.min(1, MODE.acc * dt);
    p.vy += GRAV * MODE.g * dt; p.x += p.vx * dt; p.y += p.vy * dt;
    p.x = clamp(p.x, GW + HR, W - GW - HR);
    if (p.y >= REST_Y) {
      if (wasAir && p.vy > 350) { Snd.land(p.vy / 900); dust(p.x, G, 6, 140); }
      p.y = REST_Y; p.vy = 0; p.on = true;
    } else p.on = false;
  }
  function shoePos(p) {
    const s = p.kickT > 0 ? Math.sin(Math.PI * (1 - p.kickT / KICK_DUR)) : 0;
    return { x: p.x + p.f * (30 + 18 * s), y: p.y + 50 - 56 * s };
  }
  function startKick(p) { if (p.kickT <= 0 && p.cd <= 0) { p.kickT = KICK_DUR; p.cd = KICK_CD; p.hit = false; Snd.swing(); } }
  function jump(p) { if (p.on) { p.vy = -JUMP * MODE.j * (p === p1 ? ST.jmp : 1) * (p.jb > 0 ? 1.3 : 1); p.on = false; Snd.jump(); } }

  function headVsHead(a, b) {
    const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || 0.001, min = HR * 2;
    if (d >= min) return;
    const nx = dx / d, ny = dy / d, o = (min - d) / 2;
    a.x -= nx * o; a.y -= ny * o; b.x += nx * o; b.y += ny * o;
    const vn = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
    if (vn < 0) { const j = -1.2 * vn / 2; a.vx -= j * nx; a.vy -= j * ny; b.vx += j * nx; b.vy += j * ny; }
  }
  // Top ile hareketli daire çarpışması. Dönüş değeri: çarpma şiddeti (0 = çarpma yok)
  function ballVsCircle(cx, cy, cr, cvx, cvy, e) {
    const dx = ball.x - cx, dy = ball.y - cy, d = Math.hypot(dx, dy), min = BR + cr;
    if (d >= min || d === 0) return 0;
    const nx = dx / d, ny = dy / d;
    ball.x = cx + nx * min; ball.y = cy + ny * min;
    const vn = (ball.vx - cvx) * nx + (ball.vy - cvy) * ny;
    if (vn >= 0) return 0;
    ball.vx -= (1 + e) * vn * nx; ball.vy -= (1 + e) * vn * ny;
    return -vn;
  }
  function ballVsRect(rx, ry, rw, rh) {
    const cx = clamp(ball.x, rx, rx + rw), cy = clamp(ball.y, ry, ry + rh);
    let dx = ball.x - cx, dy = ball.y - cy, d = Math.hypot(dx, dy);
    if (d >= BR) return 0;
    if (d === 0) { dx = 0; dy = -1; d = 1; }
    const nx = dx / d, ny = dy / d;
    ball.x = cx + nx * BR; ball.y = cy + ny * BR;
    const vn = ball.vx * nx + ball.vy * ny;
    if (vn >= 0) return 0;
    ball.vx -= 1.8 * vn * nx; ball.vy -= 1.8 * vn * ny;
    return -vn;
  }
  function moveBall(dt) {
    ball.vy += BALL_G * MODE.g * dt;
    ball.vx *= Math.exp(-(ball.y >= G - BR - 1 ? MODE.fr : 0.08) * dt);
    const sp = Math.hypot(ball.vx, ball.vy);
    if (sp > 1000) { ball.vx *= 1000 / sp; ball.vy *= 1000 / sp; }
    ball.x += ball.vx * dt; ball.y += ball.vy * dt; ball.rot += ball.vx * dt / BR;
    if (ball.x < BR) { ball.x = BR; if (Math.abs(ball.vx) > 150) Snd.wall(Math.abs(ball.vx)); ball.vx = Math.abs(ball.vx) * 0.6; }
    if (ball.x > W - BR) { ball.x = W - BR; if (Math.abs(ball.vx) > 150) Snd.wall(Math.abs(ball.vx)); ball.vx = -Math.abs(ball.vx) * 0.6; }
    if (ball.y < CEIL + BR) { ball.y = CEIL + BR; if (Math.abs(ball.vy) > 150) Snd.wall(Math.abs(ball.vy)); ball.vy = Math.abs(ball.vy) * 0.8; }
    if (ball.y > G - BR) {
      ball.y = G - BR;
      if (ball.vy > 130) { Snd.bounce(ball.vy); dust(ball.x, G, 3, 90); }
      ball.vy = -ball.vy * 0.74; if (Math.abs(ball.vy) < 70) ball.vy = 0;
    }
    for (const r of [[0, GT], [W - GW, GT]]) {
      const v = ballVsRect(r[0], r[1], GW, CB);
      if (v > 120) { Snd.post(v); shake = Math.max(shake, 4); }
    }
  }

  /* ================= Yapay zeka ================= */
  let aiJumpOk = true, aiReach = 0, aiWait = 0;
  function updateAI(dt) {
    aiTimer -= dt;
    if (aiTimer <= 0) {                                   // tepki gecikmesi seviyeye bağlı
      aiTimer = AI.think * (0.7 + Math.random() * 0.6);
      aiJumpOk = Math.random() < AI.jumpOk;
      const bx = ball.x + (Math.random() - 0.5) * AI.noise, pred = bx + ball.vx * AI.lead;
      aiTarget = (pred > W * 0.4 || ballIdle >= 5) ? clamp(bx + (bx >= ai.x - 10 ? 55 : 36), 94, 806) : 770;
      if (orb && level >= 4 && ballIdle < 5 && ball.x < W * 0.5 && Math.abs(orb.x - ai.x) < 380) aiTarget = clamp(orb.x, 94, 806);
    }
    const dx = aiTarget - ai.x;
    ai.ix = Math.abs(dx) < 6 ? 0 : clamp(dx / 30, -1, 1);
    const orbJump = orb && level >= 4 && Math.abs(orb.x - ai.x) < 35 && ai.y > orb.y + 30;
    if (aiJumpOk && ai.on && ((Math.abs(ball.x - ai.x) < AI.jumpRange && ball.y < ai.y - 10 && ball.y > ai.y - 170 && ball.vy > -100) || orbJump)) jump(ai);
    const near = ball.x < ai.x + 12 && Math.hypot(ball.x - (ai.x + ai.f * 40), ball.y - (ai.y + 40)) < 66;
    if (near) {                                           // düşük seviyede şuta geç başlar
      aiReach += dt;
      if (aiReach >= aiWait) { startKick(ai); aiReach = 0; aiWait = AI.wait * Math.random(); }
    } else aiReach = 0;
  }

  /* ================= Oyun akışı ================= */
  /* ---- Güç topları ---- */
  const ORB_COL = { sk: '#ffb74d', sp: '#4dd0e1', jb: '#aed581' };
  function spawnOrb() {
    const types = ['sk', 'sp', 'jb'];
    orb = { x: 220 + Math.random() * 460, y: G - 150 - Math.random() * 40, type: types[Math.floor(Math.random() * 3)], life: 9, ph: 0 };
  }
  function collectOrb(p) {
    p[orb.type] = (orb.type === 'sk' ? 12 : 8) * (p === p1 ? ST.pow : 1);
    for (let i = 0; i < 18; i++) particles.push({ t: 'c', x: orb.x, y: orb.y, vx: (Math.random() - 0.5) * 260, vy: (Math.random() - 0.5) * 260, life: 0.8, max: 0.8, r: 3, a: Math.random() * 6, c: ORB_COL[orb.type] });
    Snd.powerup(); orb = null; orbTimer = (9 + Math.random() * 6) * MODE.orb;
  }
  function updateOrb(dt) {
    if (!orb) { orbTimer -= dt; if (orbTimer <= 0) spawnOrb(); return; }
    orb.life -= dt; orb.ph += dt;
    const oy = orb.y + Math.sin(orb.ph * 3) * 6;
    for (const p of [p1, ai]) if (Math.hypot(p.x - orb.x, p.y - oy) < HR + 15) { collectOrb(p); return; }
    if (orb.life <= 0) { orb = null; orbTimer = (8 + Math.random() * 6) * MODE.orb; }
  }

  /* ---- Yavaş çekim tekrar ---- */
  function record() {
    rec.push({ a: p1.x, b: p1.y, c: p1.kickT, d: ai.x, e: ai.y, f: ai.kickT, x: ball.x, y: ball.y, r: ball.rot, fi: ball.fire > 0 });
    if (rec.length > 190) rec.shift();
  }
  function applyFrame(i) {
    const k = Math.floor(i), t = i - k, A = rec[k], B = rec[Math.min(k + 1, rec.length - 1)], l = (u, v) => u + (v - u) * t;
    p1.x = l(A.a, B.a); p1.y = l(A.b, B.b); p1.kickT = A.c; ai.x = l(A.d, B.d); ai.y = l(A.e, B.e); ai.kickT = A.f;
    ball.x = l(A.x, B.x); ball.y = l(A.y, B.y); ball.rot = l(A.r, B.r); ball.fire = A.fi ? 1 : 0;
  }
  function startReplay() {
    state = 'replay'; replayIdx = Math.max(0, rec.length - 130); particles.length = 0; trail.length = 0; flash = 0;
    applyFrame(replayIdx); Snd.whoosh();
  }
  function afterGoal() {
    if (timeLeft <= 0) endMatch(); else { resetPositions(); state = 'play'; Snd.whistle(1); }
  }
  function endReplay() { if (state === 'replay') afterGoal(); }

  function scoreGoal(who) {
    score[who]++; if (who === 0) matchGoals++; goalMine = who === 0; goalMsg = goalMine ? 'Sen attın!' : 'Bilgisayar attı!';
    state = 'goal'; goalTimer = 2; flash = 0.6; shake = 10; excite = 1; netRip[who === 0 ? 1 : 0] = 1;
    record(); orb = null; Snd.duck(3); Snd.net(); Snd.goal(goalMine); confetti(goalMine ? 150 : 50); updateHud();
  }
  function step(dt) {
    p1.ix = (keys.KeyD ? 1 : 0) - (keys.KeyA ? 1 : 0);
    if (keys.KeyW) jump(p1);
    if (keys.Space) startKick(p1);
    updateAI(dt);
    const sub = 2, h = dt / sub;
    for (let i = 0; i < sub; i++) {
      movePlayer(p1, h, P_SPEED * ST.spd * (p1.sp > 0 ? 1.4 : 1)); movePlayer(ai, h, AI.speed * (ai.sp > 0 ? 1.4 : 1)); headVsHead(p1, ai); moveBall(h);
      for (const p of [p1, ai]) {
        const s = shoePos(p);
        let v = ballVsCircle(p.x, p.y, HR, p.vx, p.vy, p === p1 ? ST.head : 0.85);          if (v > 60) { Snd.head(v); shake = Math.max(shake, Math.min(4, v / 200)); }
        v = ballVsCircle(p.x, p.y + 46, 16, p.vx, p.vy, 0.6);          if (v > 80) Snd.foot(v);
        v = ballVsCircle(s.x, s.y, SR, p.vx, 0, 0.5);                  if (v > 80) Snd.foot(v);
        if (p.kickT > 0 && !p.hit && Math.hypot(ball.x - s.x, ball.y - s.y) < BR + SR + 8) {
          const sup = p.sk > 0, pw = (p === ai ? AI.kickPow : 760 * ST.kick * MODE.kp) * (sup ? 1.45 : 1);
          ball.vx = p.f * pw + p.vx * 0.3; ball.vy = (sup ? -170 : -330) - Math.random() * 60; p.hit = true;
          if (sup) { p.sk = 0; ball.fire = 2.5; Snd.boom(); shake = 9; }
          Snd.kick(0.95); Snd.roar(0.07, true, 1.5); dust(s.x, s.y + 8, 5, 160); shake = Math.max(shake, 4); excite = Math.min(1, excite + 0.15);
        }
      }
      if (ball.y > GT + CB) {
        if (ball.x < GW - BR) { scoreGoal(1); return; }
        if (ball.x > W - GW + BR) { scoreGoal(0); return; }
      }
    }
  }
  function update(dt) {
    T += dt;
    for (const p of [p1, ai]) {
      p.kickT = Math.max(0, p.kickT - dt); p.cd = Math.max(0, p.cd - dt);

      ctx.setTransform(dpr * sc, 0, 0, dpr * sc, ox * dpr, oy * dpr);
      if (Math.floor(T * 2) % 2 === 0) { ctx.fillStyle = '#e53935'; ctx.beginPath(); ctx.arc(58, 84, 8, 0, 7); ctx.fill(); }
      ctx.fillStyle = '#fff'; ctx.textAlign = 'left'; ctx.font = '800 26px "Segoe UI", Roboto, Arial, sans-serif'; ctx.fillText('TEKRAR  ' + REPLAY_SPEED + 'x', 76, 93);
      ctx.font = '600 14px "Segoe UI", Roboto, Arial, sans-serif'; ctx.fillText('Boşluk: atla', 58, 118);
      ctx.fillStyle = 'rgba(255,255,255,.25)'; ctx.fillRect(W / 2 - 150, 468, 300, 4);
      ctx.fillStyle = '#e53935'; ctx.fillRect(W / 2 - 150, 468, 300 * Math.min(1, replayIdx / Math.max(1, rec.length - 1)), 4);
    }
    if (flash > 0) { ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = 'rgba(255,255,255,' + flash.toFixed(3) + ')'; ctx.fillRect(0, 0, cv.width, cv.height); }
  }

  /* ================= Ana döngü ================= */
  applyStats(); applyMode(); resize(); updateHud(); showMain();
  let last = performance.now();
  (function frame(now) {
    const dt = Math.min(0.033, (now - last) / 1000); last = now;
    update(dt); draw(); requestAnimationFrame(frame);
  })(last);
})();
</script>
